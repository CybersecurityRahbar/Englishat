:root{--navy:#172b4d;--blue:#2563eb;--teal:#0f766e;--orange:#f97316;--ink:#172033;--muted:#667085;--bg:#f4f7fb;--line:#e5eaf2;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(120deg,#172b4d,#244b76);color:#fff;padding:22px 18px 26px}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:18px}
.version{font-size:12px;background:#ffffff22;border:1px solid #ffffff44;padding:4px 9px;border-radius:30px}
h1{font-size:clamp(24px,4vw,36px);line-height:1.2;margin:24px 0 8px}
header p{margin:0;color:#e3edf8}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.meta span{background:#ffffff18;border:1px solid #ffffff33;padding:5px 10px;border-radius:9px;font-size:13px}
main{max-width:1100px;margin:18px auto;padding:0 16px 40px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:16px}
.side,.panel,.card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #14213d08}
.side{padding:12px;height:max-content;position:sticky;top:12px;max-height: 90vh; overflow-y: auto;}
.nav{width:100%;border:0;background:transparent;text-align:right;padding:10px 12px;border-radius:10px;font:inherit;color:#344054;cursor:pointer;margin-bottom:2px;font-size:14px;}
.nav.active{background:#eaf1ff;color:#1748a3;font-weight:700}
.content{min-width:0}
.panel{padding:clamp(16px,3vw,26px);margin-bottom:14px}
.eyebrow{font-size:12px;color:var(--teal);font-weight:800;letter-spacing:.3px}
.panel h2{margin:4px 0 12px;font-size:23px}
.word{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #eef1f5}
.word:last-child{border:0}
.word .w-main{flex:1;}
.word .big{font-size:20px;font-weight:800;direction:ltr;text-align:left;font-family:Arial,sans-serif;color:var(--navy);}
.word .w-meta{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;}
.badge{font-size:11px;padding:2px 7px;border-radius:20px;background:#eef4ff;color:#214e9b;}
.badge.family{background:#f0fdf4;color:#166534;}
.word .w-pron{color:var(--teal);font-weight:700;font-size:14px;margin-top:2px;}
.word .w-ar{color:var(--ink);font-size:15px;font-weight:600;margin-top:2px;}
.word .w-ex{direction:ltr;text-align:left;font-family:Arial,sans-serif;color:#475467;font-size:13px;margin-top:6px;background:#f8fafc;padding:6px 10px;border-radius:6px;border-right:3px solid #cbd5e1;}
.word .w-ex-ar{color:var(--muted);font-size:13px;margin-top:4px;}
.speak{padding:6px 12px;font-size:16px;background:#e9f1ff;color:#1748a3;border:0;border-radius:10px;cursor:pointer;transition:.2s;}
.speak:hover{background:#d0e2ff;}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:4px;padding:7px;max-height:none;}.nav{white-space:nowrap;width:auto;padding:8px 11px;font-size:13px}.word{flex-direction:column;}.speak{align-self:flex-start;}}
</style>

// دالة النطق
function speak(text){
  if(!('speechSynthesis' in window)){alert('ميزة النطق غير متاحة.');return}
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = .85;
  speechSynthesis.speak(u);
}

// بناء التبويبات
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
let first = true;

Object.keys(data).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'nav' + (first ? ' active' : '');
  btn.dataset.tab = key;
  btn.textContent = data[key].title;
  btn.onclick = () => switchTab(key);
  sidebar.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'panel tab' + (first ? '' : ' hidden');
  div.id = key;
  
  let html = `<div class="eyebrow">Vocabulary</div><h2>${data[key].title}</h2><div style="margin-top:15px;">`;
  
  data[key].items.forEach(item => {
    html += `
      <div class="word">
        <div class="w-main">
          <div class="big">${item.en}</div>
          <div class="w-meta">
            <span class="badge">${item.type}</span>
            ${item.family !== '---' ? `<span class="badge family">${item.family}</span>` : ''}
          </div>
          <div class="w-pron">${item.pron}</div>
          <div class="w-ar">${item.ar}</div>
          <div class="w-ex">${item.ex}</div>
          <div class="w-ex-ar">${item.exAr}</div>
        </div>
        <button class="speak" onclick="speak('${item.en.replace(/'/g, "\\'")}')">🔊</button>
      </div>
    `;
  });
  
  html += `</div>`;
  div.innerHTML = html;
  content.appendChild(div);
  first = false;
});

function switchTab(id){
  document.querySelectorAll('.nav').forEach(x => x.classList.toggle('active', x.dataset.tab === id));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('hidden', x.id !== id));
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
