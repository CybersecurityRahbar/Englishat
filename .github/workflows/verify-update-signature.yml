name: Verify APK update signature
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/verify-update-signature.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compare-signatures:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install APK signing tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Download previous 0.1.0 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: englishat-debug-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42374515936
          path: artifacts/previous

      - name: Download new 0.2.0 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: englishat-debug-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42379465477
          path: artifacts/current

      - name: Compare APK signing certificates
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          old_cert=$("$APKSIGNER" verify --print-certs artifacts/previous/app-debug.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}')
          new_cert=$("$APKSIGNER" verify --print-certs artifacts/current/app-debug.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}')
          echo "Previous certificate: $old_cert"
          echo "Current certificate:  $new_cert"
          if [[ -z "$old_cert" || -z "$new_cert" ]]; then
            echo "::error::Could not read both APK signing certificates."
            exit 1
          fi
          if [[ "$old_cert" != "$new_cert" ]]; then
            echo "::error::The signing certificates differ. Installing 0.2.0 over 0.1.0 may fail; do not uninstall until data migration is planned."
            exit 1
          fi
          echo "The signing certificates match. Update-install is supported by the signature."
